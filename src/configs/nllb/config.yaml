# Manual NLLB baseline for Sao Vicente Creole to Portuguese.
# Secrets and cache paths belong in the environment.
model:
  model: facebook/nllb-200-distilled-600M
  # Custom source token registered by the training script.
  src_lang: kea_sv_XX
  tgt_lang: por_Latn
data:
  dataset: Iscte-Sintra/Korpora_paralela_sv
  max_length: 128
tracking:
  project: Translation Models
  group_name: nllb600M_SV_manual
  run_name: nllb600M_sv_baseline_seed42
  output_base_dir: /home/criolo/storage/models_outputs/translation_models/nllb600m-sv
hub:
  push_to_hub: false
  hub_repo_id: null
  hub_private: true
workflow:
  mode: manual
  early_stopping_patience: 3
training:
  # Initial baseline values, not HPO-selected hyperparameters.
  num_train_epochs: 10
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 0.00002
  warmup_steps: 0
  warmup_ratio: 0.1
  weight_decay: 0.01
  label_smoothing_factor: 0.1
  lr_scheduler_type: linear
  optim: adamw_torch
  seed: 42
  data_seed: 42
  full_determinism: false
  max_grad_norm: 1.0
  logging_strategy: steps
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_chrf
  greater_is_better: true
  predict_with_generate: true
  generation_num_beams: 5
  generation_max_length: 128
  logging_nan_inf_filter: true
  fp16: false
  # Requires a BF16-compatible GPU.
  bf16: true
  gradient_checkpointing: true
  report_to: [wandb]
