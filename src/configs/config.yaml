# ──────────────────────────────────────────────
# W&B
# ──────────────────────────────────────────────
project: Translation Models
group_name: mbart_SV
run_name: mbart_v1.0

# Local saving (Absolute path on mounted drive)
output_base_dir: "/home/criolo/storage/models_outputs/translation_models"

# ──────────────────────────────────────────────
# Model & Tokenizer
# ──────────────────────────────────────────────
model: "Iscte-Sintra/teste01-sv"
torch_dtype: bfloat16
src_lang: kea_st_XX
tgt_lang: pt_XX

# ──────────────────────────────────────────────
# Dataset
# ──────────────────────────────────────────────
dataset: Iscte-Sintra/Korpora_paralela_sv
text_column: text
remove_columns: [text, category, language]
max_length: 128

# ──────────────────────────────────────────────
# Training
# ──────────────────────────────────────────────
num_train_epochs: 3
per_device_train_batch_size: 64
per_device_eval_batch_size: 64
learning_rate: 2.0e-5
warmup_steps: 100
weight_decay: 0.01
logging_steps: 10

# Align evaluation and saving strategies to epoch boundaries
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 3

fp16: false
bf16: true
gradient_checkpointing: true
early_stopping_patience: 3
generation_num_beams: 5

metric_for_best_model: eval_SacreBleu
greater_is_better: True

# ──────────────────────────────────────────────
# Push to Hub
# ──────────────────────────────────────────────
push_to_hub: false
hub_repo_id: "Iscte-Sintra/teste01-sv"
hub_private: true