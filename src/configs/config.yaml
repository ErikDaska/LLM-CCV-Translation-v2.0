# ──────────────────────────────────────────────
# W&B
# ──────────────────────────────────────────────
project: Translation Models
group_name: mbart_SV
run_name: mbart_v1.0

# ──────────────────────────────────────────────
# Model & Tokenizer
# ──────────────────────────────────────────────
model: facebook/mbart-large-50-many-to-many-mmt
torch_dtype: bfloat16
src_lang: kea_sv_XX
tgt_lang: pt_XX

# ──────────────────────────────────────────────
# Dataset
# ──────────────────────────────────────────────
dataset: Iscte-Sintra/Korpora_paralela_sv
# TODO: Implementar no training script
text_column: text
remove_columns: [text, category, language]
max_length: 128

# ──────────────────────────────────────────────
# Training
# ──────────────────────────────────────────────
num_train_epochs: 3
per_device_train_batch_size: 64
per_device_eval_batch_size: 64
learning_rate: 2.0e-5
warmup_steps: 100
weight_decay: 0.01
logging_steps: 10
eval_strategy: steps
eval_steps: 500
save_strategy: steps
save_steps: 500
save_total_limit: 3
fp16: false
bf16: true
gradient_checkpointing: true
early_stopping_patience: 3
generation_num_beams: 5

# Attention when changing this parameters the logic may invert
metric_for_best_model: eval_bleu
greater_is_better: True