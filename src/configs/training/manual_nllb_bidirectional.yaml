# Manual NLLB baseline bidirectional kea<->pt on the kea-sv-pt-v2 corpus.
# Checkpoint selection uses kea->pt (eval_chrf); pt->kea is reported after
# training under metrics.json:validation_bidirectional.
defaults:
  - model: nllb
  - data: kea_sv_pt
  - training_arguments: manual_nllb
  - _self_

early_stopping_patience: 3
hub:
  push_to_hub: false
  hub_repo_id: null
  hub_private: true
tracking:
  project: Translation Models
  group_name: nllb600M_KEAPT_bidirectional
  run_name: nllb600M_keapt_bidirectional_seed42
  output_base_dir: /home/criolo/storage/models_outputs/translation_models/nllb600m-keapt-bidir
