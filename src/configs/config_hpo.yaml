# Experiment configuration. Secrets and cache paths belong in the environment.
model:
  model: facebook/mbart-large-50
  src_lang: kea_sv_XX
  tgt_lang: pt_XX
data:
  dataset: Iscte-Sintra/Korpora_paralela_sv
  max_length: 128
tracking:
  project: Translation Models
  group_name: m2m100_SV_HPO
  run_name: cpt_m2m100_418M
  output_base_dir: /home/criolo/storage/models_outputs/translation_models/m2m100-sv
hub:
  push_to_hub: false
  hub_repo_id: Iscte-Sintra/teste01-sv
  hub_private: true
workflow:
  mode: hpo
training:
  # Fixed settings shared by every trial.
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  warmup_steps: 0
  lr_scheduler_type: linear
  optim: adamw_torch
  seed: 42
  data_seed: 42
  full_determinism: false
  max_grad_norm: 1.0
  logging_strategy: steps
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: 'steps'
  save_total_limit: 3
  predict_with_generate: true
  generation_num_beams: 5
  load_best_model_at_end: false
  metric_for_best_model: eval_chrf
  greater_is_better: true
  logging_nan_inf_filter: true
  fp16: false
  bf16: true
  gradient_checkpointing: true
  report_to:
  - wandb
  generation_max_length: 128
hpo:
  sampler_seed: 42
  objective: eval_chrf
  direction: maximize
  trials: 50
  search_space:
    # Sampled settings must not also appear in training.
    learning_rate:
      type: float
      low: 5.0e-06
      high: 5.0e-05
      log: true
    per_device_train_batch_size:
      type: categorical
      choices:
      - 8
      - 16
      - 32
    num_train_epochs:
      type: int
      low: 3
      high: 10
    label_smoothing_factor:
      type: float
      low: 0.0
      high: 0.2
    warmup_ratio:
      type: float
      low: 0.0
      high: 0.15
    weight_decay:
      type: float
      low: 0.0001
      high: 0.1
      log: true
