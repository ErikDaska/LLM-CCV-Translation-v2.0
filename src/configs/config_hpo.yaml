# ──────────────────────────────────────────────
# W&B
# ──────────────────────────────────────────────
project: "Translation Models"
group_name: "m2m100_SV_HPO"

# ──────────────────────────────────────────────
# Local saving
# ──────────────────────────────────────────────
output_base_dir: "/home/criolo/storage/models_outputs/translation_models/m2m100-sv"

# ──────────────────────────────────────────────
# Model & Tokenizer
# ──────────────────────────────────────────────
model: "facebook/m2m100_418M"

torch_dtype: "bfloat16"

# Custom Cape Verdean Creole language
src_lang: "kea_sv_XX"

# M2M-100 Portuguese language code
tgt_lang: "pt"

# ──────────────────────────────────────────────
# Dataset
# ──────────────────────────────────────────────
dataset: "Iscte-Sintra/Korpora_paralela_sv"

max_length: 128

# ──────────────────────────────────────────────
# HPO
# ──────────────────────────────────────────────
hyperparameter_search: true
hpo_trials: 50

# ──────────────────────────────────────────────
# Training
# ──────────────────────────────────────────────
# These parameters remain fixed during HPO.
# Optimized parameters are supplied by Optuna.

per_device_eval_batch_size: 64

warmup_steps: 100

weight_decay: 0.01

logging_steps: 10

# Evaluate after every epoch
eval_strategy: "epoch"

# Do not save checkpoints during HPO
save_strategy: "no"

fp16: false
bf16: true

gradient_checkpointing: true

early_stopping_patience: 3

generation_num_beams: 5

# ──────────────────────────────────────────────
# HPO Objective
# ──────────────────────────────────────────────
metric_for_best_model: "eval_loss"

greater_is_better: true

# ──────────────────────────────────────────────
# Push to Hub
# ──────────────────────────────────────────────
# Individual HPO trials are NOT pushed.
push_to_hub: false

hub_repo_id: "Iscte-Sintra/teste01-sv"

hub_private: true